[project]
name = "geo-distance-arena"
version = "0.1.0"
description = "Geo-Distance Arena: as the crow flies is not how the van drives"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "osmnx>=1.9",
    "networkx>=3.3",
    "geopy>=2.4",
    "geographiclib>=2.0",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "scikit-learn>=1.5",
    "folium>=0.17",
    "numpy>=1.26",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.38",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
extras = [
    "igraph>=0.11",      # faster shortest paths for large many-to-many matrices
    "h3>=4.0",           # hexagonal spatial indexing for catchment aggregation
    "contextily>=1.6",   # static basemap tiles for figures
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ty>=0.0.1a7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

# The `src/` tree is a flat namespace imported by path (e.g. `python -m src.graph.build`
# from the project root), not an installed distribution, so uv does not build it.
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
